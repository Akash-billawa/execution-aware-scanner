apiVersion: v1
kind: Namespace
metadata:
  name: execution-aware-scanner
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner-agent
  namespace: execution-aware-scanner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scanner-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scanner-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: scanner-agent
subjects:
  - kind: ServiceAccount
    name: scanner-agent
    namespace: execution-aware-scanner
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scanner-agent
  namespace: execution-aware-scanner
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner-agent
    spec:
      serviceAccountName: scanner-agent
      hostPID: true
      hostNetwork: false
      tolerations:
        - operator: Exists
      containers:
        - name: scanner-agent
          image: ghcr.io/example/execution-aware-scanner:latest
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: RUST_LOG
              value: info
            - name: SCANNER__RUNTIME__NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SCANNER__RUNTIME__SBOM_DIR
              value: /var/lib/scanner/sboms
            - name: SCANNER__RUNTIME__SECCOMP_OUTPUT_DIR
              value: /var/lib/scanner/seccomp
            - name: SCANNER__BPF__OBJECT_PATH
              value: /opt/scanner/scanner-ebpf.so
          ports:
            - name: metrics
              containerPort: 9898
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ["BPF", "PERFMON", "NET_ADMIN", "SYS_ADMIN"]
          volumeMounts:
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: scanner-state
              mountPath: /var/lib/scanner
            - name: scanner-ebpf
              mountPath: /opt/scanner
              readOnly: true
      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
        - name: proc
          hostPath:
            path: /proc
        - name: scanner-state
          hostPath:
            path: /var/lib/execution-aware-scanner
            type: DirectoryOrCreate
        - name: scanner-ebpf
          configMap:
            name: scanner-ebpf-bundle
