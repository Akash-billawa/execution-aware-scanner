apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanner-agent
  namespace: execution-aware-scanner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scanner-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9898
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
