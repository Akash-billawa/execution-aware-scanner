[workspace]
members = [
    "scanner-agent",
    "scanner-common",
    # "scanner-ebpf",  # Built separately for Linux/BPF target only
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"
authors = ["OpenCode"]

[workspace.dependencies]
anyhow = "1.0"
bytes = { version = "1.7", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
config = "0.14"
futures = "0.3"
k8s-openapi = { version = "0.23", features = ["v1_30"] }
kube = { version = "0.96", features = ["runtime", "derive", "client", "rustls-tls"] }
prometheus-client = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.11", features = ["serde", "v4"] }

# Linux-only eBPF dependencies (declared in workspace, conditionally used)
# Using compatible versions - these must match between user-space and kernel-space
aya = { version = "0.13", features = ["async_tokio"] }
aya-log = "0.2"
aya-log-ebpf = "0.1"

# Build profiles
[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
