name: Helm Chart Release

on:
  push:
    branches: [ main ]
    paths:
      - 'helm/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        run: helm lint helm/execution-aware-scanner

      - name: Helm Template
        run: |
          helm template test helm/execution-aware-scanner \
            --namespace scanner-system \
            --set image.tag=latest \
            > /dev/null

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: helm
          skip_packaging: false
          skip_existing: true
          mark_as_latest: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  oci-publish:
    name: Publish to GHCR OCI
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Set lowercase chart name
        id: vars
        run: |
          CHART_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "chart=ghcr.io/${CHART_NAME}/execution-aware-scanner" >> "$GITHUB_OUTPUT"

      - name: Package chart
        run: |
          helm package helm/execution-aware-scanner \
            --version $(echo $GITHUB_REF | sed 's|refs/tags/v||') \
            --app-version $(echo $GITHUB_REF | sed 's|refs/tags/v||')

      - name: Push to OCI registry
        run: |
          CHART_PKG=$(ls *.tgz)
          helm push "$CHART_PKG" oci://${{ steps.vars.outputs.chart }}
