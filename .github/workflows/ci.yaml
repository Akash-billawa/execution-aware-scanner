name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build and test on Linux (user-space code only)
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ hashFiles('**/Cargo.lock') }}

      - name: Build scanner-common
        run: cargo build -p scanner-common --release

      - name: Build scanner-agent (Linux safe)
        run: cargo build -p scanner-agent --release --no-default-features
        env:
          SKIP_PROTO: 1

      - name: Run tests
        run: cargo test -p scanner-common --release
        env:
          RUST_LOG: debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: target/release/scanner-agent
          retention-days: 7

  # Build on Windows/Mac (without eBPF)
  build-cross-platform:
    name: Build (Cross Platform)
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build scanner-common
        run: cargo build -p scanner-common --release

      - name: Build scanner-agent (without eBPF)
        run: cargo build -p scanner-agent --release --no-default-features

      - name: Run tests (scanner-common only)
        run: cargo test -p scanner-common --release

  # Lint and format check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (common only)
        run: cargo clippy -p scanner-common

      - name: Run clippy (agent without eBPF)
        run: cargo clippy -p scanner-agent --no-default-features

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
