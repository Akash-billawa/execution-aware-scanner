name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: bpfel-unknown-none
      - name: Install bpf-linker
        run: cargo install bpf-linker
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build scanner-common
        run: cargo build -p scanner-common
      - name: Test scanner-agent
        run: cargo test -p scanner-agent
      - name: Lint
        run: cargo fmt --all --check && cargo clippy --all-targets --all-features -- -D warnings
