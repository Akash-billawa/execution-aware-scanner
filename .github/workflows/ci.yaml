name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang llvm libelf-dev linux-headers-$(uname -r)
          # Install bpf-linker via cargo using nightly (required for newer versions)
          rustup toolchain install nightly
          cargo +nightly install bpf-linker
      
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install protobuf llvm libelf
          # Note: bpf-linker and kernel headers are Linux-specific, not needed on macOS for no-eBPF builds
      
      - name: Build (no-eBPF features)
        run: cargo build --workspace --no-default-features
      
      - name: Run tests (no-eBPF features)
        run: cargo test --workspace --no-default-features --quiet
      
      - name: Check code formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        run: cargo clippy --workspace --no-default-features -- -D warnings
      
      - name: Build (with eBPF features - Linux only)
        if: runner.os == 'Linux'
        run: cargo build --workspace --features ebpf
      
      - name: Run tests (with eBPF features - Linux only)
        if: runner.os == 'Linux'
        run: cargo test --workspace --features ebpf --quiet
      
      - name: eBPF Smoke Test (Linux only)
        if: runner.os == 'Linux'
        run: |
          # Build the agent with eBPF support
          cargo build --release -p scanner-agent --features ebpf
          
          # Run for a short duration to verify eBPF programs load
          sudo timeout 20 ./target/release/scanner-agent || true
          
          # Verify eBPF programs were loaded
          echo "Checking for loaded eBPF programs..."
          sudo bpftool prog list | grep -E "execve|tracepoint|kprobe|security" || echo "No eBPF programs found (may be expected if no events generated)"
          
          # Check that we can at least see the programs attempted to load
          dmesg | tail -20 | grep -E "bpf|BPF" || echo "No BPF messages in dmesg"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner name
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/execution-aware-scanner:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.vars.outputs.owner }}/execution-aware-scanner:cache
          cache-to: type=registry,ref=ghcr.io/${{ steps.vars.outputs.owner }}/execution-aware-scanner:cache,mode=max
