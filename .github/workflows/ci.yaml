name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Build and test on Linux (full build with eBPF)
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: bpfel-unknown-none
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libelf-dev linux-headers-$(uname -r)
      
      - name: Install bpf-linker
        run: cargo install bpf-linker
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build scanner-common
        run: cargo build -p scanner-common --release
      
      - name: Build eBPF program
        run: |
          cargo build --target bpfel-unknown-none -p scanner-ebpf --release
          mkdir -p dist
          cp target/bpfel-unknown-none/release/scanner-ebpf dist/scanner-ebpf.o
      
      - name: Build scanner-agent (with eBPF)
        run: cargo build -p scanner-agent --release --features ebpf
      
      - name: Run tests
        run: cargo test --workspace --release --features ebpf
        env:
          RUST_LOG: debug
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            target/release/scanner-agent
            dist/scanner-ebpf.o
          retention-days: 7

  # Build on Windows/Mac (without eBPF)
  build-cross-platform:
    name: Build (Cross Platform)
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build scanner-common
        run: cargo build -p scanner-common --release
      
      - name: Build scanner-agent (without eBPF)
        run: cargo build -p scanner-agent --release --no-default-features
        env:
          RUSTFLAGS: "--cfg scanner_agent_no_ebpf"
      
      - name: Run tests (scanner-common only)
        run: cargo test -p scanner-common --release

  # Lint and format check
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy (common only)
        run: cargo clippy -p scanner-common -- -D warnings
      
      - name: Run clippy (with eBPF)
        run: cargo clippy --workspace --features ebpf -- -D warnings

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run cargo audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build Docker image
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-linux
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
