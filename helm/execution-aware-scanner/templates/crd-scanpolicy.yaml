{{- if .Values.operator.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scanpolicies.scanner.example.com
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  labels:
    {{- include "execution-aware-scanner.labels" . | nindent 4 }}
spec:
  group: scanner.example.com
  names:
    kind: ScanPolicy
    listKind: ScanPolicyList
    plural: scanpolicies
    singular: scanpolicy
    shortNames:
      - sp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: ScanPolicy defines a scanning policy for the execution-aware scanner
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: ScanPolicySpec defines the desired state of ScanPolicy
              properties:
                schedule:
                  type: string
                  description: "Cron schedule for recurring scans (e.g., '0 */6 * * *')"
                targetNamespaces:
                  type: array
                  items:
                    type: string
                  description: Namespaces to scan (empty = all)
                enforcementMode:
                  type: string
                  enum: [Audit, Warn, Enforce]
                  default: Audit
                  description: Enforcement mode for findings
                policies:
                  type: array
                  items:
                    type: string
                  description: Rego policy files to apply
                webhooks:
                  type: array
                  items:
                    type: object
                    properties:
                      url:
                        type: string
                      type:
                        type: string
                        enum: [Slack, Teams, Generic, Elastic, Splunk, Datadog]
                      minSeverity:
                        type: string
                        enum: [Low, Medium, High, Critical]
                scanConfig:
                  type: object
                  properties:
                    maxConcurrent:
                      type: integer
                      default: 5
                    timeoutSeconds:
                      type: integer
                      default: 300
                    includeSBOM:
                      type: boolean
                      default: true
                    includeVulnScan:
                      type: boolean
                      default: true
            status:
              type: object
              description: ScanPolicyStatus defines the observed state of ScanPolicy
              properties:
                lastScanTime:
                  type: string
                  format: date-time
                lastScanStatus:
                  type: string
                  enum: [Success, Failed, InProgress]
                findingsCount:
                  type: object
                  properties:
                    critical:
                      type: integer
                    high:
                      type: integer
                    medium:
                      type: integer
                    low:
                      type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
{{- end }}
