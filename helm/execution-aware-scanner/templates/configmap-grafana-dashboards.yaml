{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "execution-aware-scanner.fullname" . }}-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "execution-aware-scanner.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  scanner-overview.json: |-
    {{- .Files.Get "grafana/dashboards/scanner-overview.json" | nindent 4 }}
  attack-paths.json: |-
    {{- .Files.Get "grafana/dashboards/attack-paths.json" | nindent 4 }}
  enforcement.json: |-
    {{- .Files.Get "grafana/dashboards/enforcement.json" | nindent 4 }}
{{- end }}
