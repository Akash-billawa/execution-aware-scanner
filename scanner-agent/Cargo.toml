[package]
name = "scanner-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# eBPF support is Linux-only. Enable explicitly on Linux hosts.
ebpf = ["dep:aya", "dep:aya-log"]
# Security: Build without eBPF runtime support (for cross-platform builds)
no-ebpf = []
remediator-proto = ["dep:tonic", "dep:prost"]

[dependencies]
prost = { version = "0.13", optional = true }
anyhow.workspace = true
axum = "0.7"
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
config.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
petgraph = "0.6"
prometheus-client.workspace = true
reqwest.workspace = true
scanner-common = { path = "../scanner-common" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic = { version = "0.13", optional = true }
tower = "0.5"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio-test = "0.4"

[build-dependencies]
tonic-build = "0.13"
prost-build = "0.13"
which = "7.0"

[target.'cfg(target_os = "linux")'.dependencies]
# eBPF dependencies - optional, enabled via ebpf feature on Linux only.
aya = { workspace = true, optional = true }
aya-log = { workspace = true, optional = true }