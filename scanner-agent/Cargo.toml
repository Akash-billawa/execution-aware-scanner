[package]
name = "scanner-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
ebpf = ["dep:aya", "dep:aya-log"]
remediator-proto = ["dep:tonic"]

[dependencies]
anyhow.workspace = true
axum = "0.7"
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
config.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
prometheus-client.workspace = true
reqwest.workspace = true
scanner-common = { path = "../scanner-common" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic = { version = "0.13", optional = true }
tower = "0.5"
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# Linux-only eBPF dependencies - only when ebpf feature is enabled
[target.'cfg(all(target_os = "linux", feature = "ebpf"))'.dependencies]
aya = { workspace = true }
aya-log = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"

[build-dependencies]
tonic-build = "0.13"
which = "7.0"
